[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sublocal"
version = "0.1.0"
description = "Local-only subtitle translation with small models. No cloud APIs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Maruan Aguerdouh" }]
keywords = ["subtitles", "translation", "nllb", "ctranslate2", "offline"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "ctranslate2>=4.0.0",
  "huggingface-hub>=0.23.0",
  "langdetect>=1.0.9",
  "sentencepiece>=0.2.0",
  "transformers>=4.40.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
sublocal = "sublocal.cli:main"

[project.urls]
Homepage = "https://github.com/Ephoniz/sublocal"

[tool.hatch.build.targets.wheel]
packages = ["sublocal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

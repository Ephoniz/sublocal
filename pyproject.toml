[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sublocal"
version = "0.5.0"
description = "Local-only subtitle translation and transcription. No cloud APIs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Maruan Aguerdouh" }]
keywords = ["subtitles", "translation", "transcription", "gemmax", "whisper", "llama-cpp", "offline"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "av>=11.0.0",
  "ctranslate2>=4.0.0",
  "faster-whisper>=1.0.0",
  "huggingface-hub>=0.23.0",
  "langdetect>=1.0.9",
  "llama-cpp-python==0.3.4",
  "regex>=2025.10.22",
  "sentencepiece>=0.2.0",
  "stable-ts-whisperless>=2.18.0",
  "transformers>=4.40.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
lid = ["lingua-language-detector==1.4.2"]

[project.scripts]
sublocal = "sublocal.cli:main"

[project.urls]
Homepage = "https://github.com/Ephoniz/sublocal"

[tool.hatch.build.targets.wheel]
packages = ["sublocal"]

# 0.3.35 cu124 win_amd64 raises OSError 0xc000001d (illegal instruction) in
# llama_context: ggml-cpu.dll is built with AVX512/AMX; i7-13700K AVX512=false.
# 0.3.4 cu124 cp311 loads and offloads 43/43 layers. pip must not resolve 0.3.35.
#   pip install . --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cu124
[[tool.uv.index]]
name = "llama-cpp-cu124"
url = "https://abetlen.github.io/llama-cpp-python/whl/cu124"
explicit = true

[tool.uv.sources]
llama-cpp-python = { index = "llama-cpp-cu124" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
